name: Model Training CICD

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Set up Node.js for CML
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev

      # 5. Install CML
      - name: Set up CML
        uses: iterative/setup-cml@v2

      # 6. Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 7. Train ML models
      - name: Train model
        run: |
          python train_model.py

      # 8. Generate model report
      - name: Generate model report
        run: |
          echo "# Model Training Report" > report.md

          echo "## Model Performance" >> report.md
          cat scores.txt >> report.md

          echo "" >> report.md
          echo "## Logistic Regression Confusion Matrix" >> report.md
          echo "![Logistic Regression](ConfusionMatrix_LR.png)" >> report.md

          echo "" >> report.md
          echo "## Random Forest Confusion Matrix" >> report.md
          echo "![Random Forest](ConfusionMatrix_RF.png)" >> report.md

          echo "" >> report.md
          echo "## Feature Importance" >> report.md
          echo "![Feature Importance](FeatureImportance.png)" >> report.md

      # 9. Upload generated files as GitHub artifacts
      - name: Upload model results
        uses: actions/upload-artifact@v4
        with:
          name: model-training-results
          path: |
            scores.txt
            report.md
            ConfusionMatrix_LR.png
            ConfusionMatrix_RF.png
            FeatureImportance.png

      # 10. Publish report as a PR comment
      - name: Publish CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md
